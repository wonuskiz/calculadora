name: Atualizar cotações

on:
  schedule:
    # Roda a cada hora, no minuto 5 (evita o "rush" do minuto 0 nos servidores do GitHub)
    - cron: "5 * * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba "Actions"

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Buscar cotações (JPY, KRW, CNY, USD → BRL)
        id: fetch
        run: |
          fetch_rate() {
            local moeda="$1"
            local http_code body response

            response=$(curl -sS --max-time 15 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
              -H "Accept: application/json" \
              -w $'\n%{http_code}' \
              "https://api.exchangerate.fun/latest?base=${moeda}")
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')

            if [ "$http_code" != "200" ]; then
              echo "::warning::Falha ao buscar ${moeda}. HTTP ${http_code}. Resposta: $(echo "$body" | head -c 200)" >&2
              echo ""
              return
            fi

            echo "$body" | jq -r '.rates.BRL // empty' 2>/dev/null
          }

          JPY=$(fetch_rate JPY)
          KRW=$(fetch_rate KRW)
          CNY=$(fetch_rate CNY)
          USD=$(fetch_rate USD)

          echo "Valores obtidos -> JPY=$JPY KRW=$KRW CNY=$CNY USD=$USD"

          # Se alguma moeda vier vazia, mantém o arquivo atual (não quebra a calculadora).
          if [ -z "$JPY" ] || [ -z "$KRW" ] || [ -z "$CNY" ] || [ -z "$USD" ]; then
            echo "::warning::Pelo menos uma cotação falhou. Mantendo o arquivo atual sem alterações."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p data
          jq -n \
            --arg updated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg jpy "$JPY" --arg krw "$KRW" --arg cny "$CNY" --arg usd "$USD" \
            '{
              updated_at: $updated_at,
              rates: {
                JPY: ($jpy | tonumber),
                KRW: ($krw | tonumber),
                CNY: ($cny | tonumber),
                USD: ($usd | tonumber)
              }
            }' > data/rates.json

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commitar se houver mudança
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          git diff --cached --quiet && echo "Sem mudanças na cotação." && exit 0
          git commit -m "Atualiza cotações ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
