name: Atualizar cotações

on:
  schedule:
    # Roda a cada hora, no minuto 5 (evita o "rush" do minuto 0 nos servidores do GitHub)
    - cron: "5 * * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba "Actions"

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Buscar cotações (Open Exchange Rates, base USD)
        run: |
          # Plano gratuito da Open Exchange Rates só permite base=USD, então pedimos
          # USD/BRL/JPY/KRW/CNY (tudo em relação a USD) numa única chamada, e depois
          # calculamos a "ponte" pra BRL: taxa(X→BRL) = rates.BRL / rates.X
          response=$(curl -sS --max-time 15 -w $'\n%{http_code}' \
            "https://openexchangerates.org/api/latest.json?app_id=${OXR_APP_ID}&symbols=BRL,JPY,KRW,CNY,USD")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          body_preview=$(echo "$body" | head -c 300 | tr '\n' ' ')

          mkdir -p data

          if [ "$http_code" != "200" ]; then
            jq -n --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg code "$http_code" --arg body "$body_preview" \
              '{ last_run_at: $ts, success: false, http_code: $code, body_preview: $body }' > data/debug-last-run.json
            echo "::warning::Falha ao buscar cotações. HTTP ${http_code}. Veja data/debug-last-run.json."
            exit 0
          fi

          BRL=$(echo "$body" | jq -r '.rates.BRL // empty')
          JPY=$(echo "$body" | jq -r '.rates.JPY // empty')
          KRW=$(echo "$body" | jq -r '.rates.KRW // empty')
          CNY=$(echo "$body" | jq -r '.rates.CNY // empty')
          USD=$(echo "$body" | jq -r '.rates.USD // empty')

          if [ -z "$BRL" ] || [ -z "$JPY" ] || [ -z "$KRW" ] || [ -z "$CNY" ] || [ -z "$USD" ]; then
            jq -n --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg body "$body_preview" \
              '{ last_run_at: $ts, success: false, http_code: "200", note: "resposta sem os campos esperados", body_preview: $body }' > data/debug-last-run.json
            echo "::warning::Resposta da API veio incompleta. Veja data/debug-last-run.json."
            exit 0
          fi

          # Cross-rate: quanto vale 1 unidade de cada moeda, em reais.
          RATE_JPY=$(echo "$BRL $JPY" | awk '{ printf "%.8f", $1 / $2 }')
          RATE_KRW=$(echo "$BRL $KRW" | awk '{ printf "%.8f", $1 / $2 }')
          RATE_CNY=$(echo "$BRL $CNY" | awk '{ printf "%.8f", $1 / $2 }')
          RATE_USD=$(echo "$BRL $USD" | awk '{ printf "%.8f", $1 / $2 }')

          jq -n \
            --arg updated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg jpy "$RATE_JPY" --arg krw "$RATE_KRW" --arg cny "$RATE_CNY" --arg usd "$RATE_USD" \
            '{
              updated_at: $updated_at,
              rates: {
                JPY: ($jpy | tonumber),
                KRW: ($krw | tonumber),
                CNY: ($cny | tonumber),
                USD: ($usd | tonumber)
              }
            }' > data/rates.json

          jq -n --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{ last_run_at: $ts, success: true }' > data/debug-last-run.json

          echo "Cotações atualizadas -> JPY=$RATE_JPY KRW=$RATE_KRW CNY=$RATE_CNY USD=$RATE_USD"
        env:
          OXR_APP_ID: ${{ secrets.OXR_APP_ID }}

      - name: Commitar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rates.json data/debug-last-run.json
          git diff --cached --quiet && echo "Sem mudanças para commitar." && exit 0
          git commit -m "Atualiza cotações ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
