name: Atualizar cotações

on:
  schedule:
    # Roda a cada hora, no minuto 5 (evita o "rush" do minuto 0 nos servidores do GitHub)
    - cron: "5 * * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba "Actions"

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Buscar cotações (JPY, KRW, CNY, USD → BRL)
        id: fetch
        run: |
          fetch_rate() {
            local moeda="$1"
            local http_code body response rate

            response=$(curl -sS --max-time 15 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
              -H "Accept: application/json" \
              -w $'\n%{http_code}' \
              "https://api.exchangerate.fun/latest?base=${moeda}")
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            rate=""
            if [ "$http_code" = "200" ]; then
              rate=$(echo "$body" | jq -r '.rates.BRL // empty' 2>/dev/null)
            fi

            # IMPORTANTE: usamos "declare -g" chamando a função diretamente (sem $(...)),
            # porque command substitution roda em subshell e perderia essas variáveis.
            declare -g "HTTP_${moeda}=${http_code}"
            declare -g "BODY_${moeda}=$(echo "$body" | head -c 300 | tr '\n' ' ')"
            declare -g "RATE_${moeda}=${rate}"
          }

          fetch_rate JPY
          fetch_rate KRW
          fetch_rate CNY
          fetch_rate USD

          JPY="$RATE_JPY"
          KRW="$RATE_KRW"
          CNY="$RATE_CNY"
          USD="$RATE_USD"

          echo "Valores obtidos -> JPY=$JPY KRW=$KRW CNY=$CNY USD=$USD"

          mkdir -p data

          # Arquivo de diagnóstico: salvo SEMPRE, com ou sem sucesso, pra facilitar investigar falhas.
          jq -n \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg jpy_code "$HTTP_JPY" --arg jpy_body "$BODY_JPY" --arg jpy_val "$JPY" \
            --arg krw_code "$HTTP_KRW" --arg krw_body "$BODY_KRW" --arg krw_val "$KRW" \
            --arg cny_code "$HTTP_CNY" --arg cny_body "$BODY_CNY" --arg cny_val "$CNY" \
            --arg usd_code "$HTTP_USD" --arg usd_body "$BODY_USD" --arg usd_val "$USD" \
            '{
              last_run_at: $ts,
              JPY: { http_code: $jpy_code, rate: $jpy_val, body_preview: $jpy_body },
              KRW: { http_code: $krw_code, rate: $krw_val, body_preview: $krw_body },
              CNY: { http_code: $cny_code, rate: $cny_val, body_preview: $cny_body },
              USD: { http_code: $usd_code, rate: $usd_val, body_preview: $usd_body }
            }' > data/debug-last-run.json

          # Se alguma moeda vier vazia, mantém o rates.json atual (não quebra a calculadora).
          if [ -z "$JPY" ] || [ -z "$KRW" ] || [ -z "$CNY" ] || [ -z "$USD" ]; then
            echo "::warning::Pelo menos uma cotação falhou. Veja data/debug-last-run.json para detalhes."
            exit 0
          fi

          jq -n \
            --arg updated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg jpy "$JPY" --arg krw "$KRW" --arg cny "$CNY" --arg usd "$USD" \
            '{
              updated_at: $updated_at,
              rates: {
                JPY: ($jpy | tonumber),
                KRW: ($krw | tonumber),
                CNY: ($cny | tonumber),
                USD: ($usd | tonumber)
              }
            }' > data/rates.json

      - name: Commitar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rates.json data/debug-last-run.json
          git diff --cached --quiet && echo "Sem mudanças para commitar." && exit 0
          git commit -m "Atualiza cotações ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
